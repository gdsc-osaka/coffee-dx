name = "coffee-dx"
compatibility_date = "2026-04-04"
compatibility_flags = ["nodejs_compat"]
main = "./worker.ts"
assets = { directory = "./build/client" }

[vars]
# 店舗固定QRのURLに使う公開トークン。店舗ごとに変更してデプロイする。
MOBILE_ORDER_STORE_TOKEN = "7c6a1b0e9d4f2a8c5e1b7d3f9a6c0e2d"

# react-router build の出力へ差し替え（wrangler deploy / wrangler dev のバンドル用）
[alias]
"virtual:react-router/server-build" = "./build/server/index.js"

[[d1_databases]]
binding = "DB"
database_name = "coffee-dx-db"
database_id = "548f7cf3-07db-4da6-b3a7-8f769d3a685d"
migrations_dir = "drizzle/migrations"

# Durable Objects
[[durable_objects.bindings]]
name = "ORDER_DO"
class_name = "OrderDurableObject"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["OrderDurableObject"]
